name: firebase
description: Provides support for generating logs for the app
publish_to: 'none'
resolution: workspace

environment:
  sdk: ^3.9.2

dependencies:
  cloud_firestore: ^6.0.2
  cloud_functions: ^6.0.2
  core: any
  equatable: ^2.0.7
  firebase_analytics: ^12.0.2
  firebase_app_check: ^0.4.1
  firebase_auth: ^6.1.0
  firebase_core: ^4.1.1
  firebase_crashlytics: ^5.0.2
  firebase_remote_config: ^6.0.2
  firebase_storage: ^13.0.2
  flutter:
    sdk: flutter
  module_injector: any
  path_provider: ^2.1.5

dev_dependencies:
  fake_cloud_firestore: ^4.0.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
