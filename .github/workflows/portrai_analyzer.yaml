name: portrai_analyzer

on:
  pull_request:
    paths:
      - 'tool/portrai_analyzer/**'
      - '.github/workflows/portrai_analyzer.yaml'
      - '.github/actions/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  analyze_and_test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.13.3'

      - name: Setup Dart Module
        uses: ./.github/actions/setup-dart-module
        with:
          module-path: tool/portrai_analyzer
      
      - name: Quality Checks
        uses: ./.github/actions/dart-quality-checks
        with:
          module-path: tool/portrai_analyzer
          collect-coverage: 'true'
