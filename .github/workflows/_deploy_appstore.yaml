name: Deploy to App Store

on:
  workflow_call:
    inputs:
      artifact-name:
        description: Name of the IPA artifact to deploy
        required: true
        type: string
      version:
        description: Version name from tag
        required: true
        type: string
      build-number:
        description: Build number from tag
        required: true
        type: string
    secrets:
      APP_STORE_CONNECT_API_KEY_ID:
        description: App Store Connect API Key ID
        required: true
      APP_STORE_CONNECT_API_ISSUER_ID:
        description: App Store Connect API Issuer ID
        required: true
      APP_STORE_CONNECT_API_KEY:
        description: App Store Connect API Key (base64 encoded .p8 file)
        required: true
      APP_STORE_BUNDLE_ID:
        description: iOS bundle identifier
        required: true

jobs:
  deploy:
    name: Upload to App Store Connect
    runs-on: macos-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download IPA artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: ./build-output

      - name: Setup App Store Connect API Key
        env:
          API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        run: |
          umask 077
          test -n "$API_KEY"
          if [[ ! "$API_KEY_ID" =~ ^[A-Za-z0-9]+$ ]]; then
            echo "::error::Invalid App Store Connect API Key ID"
            exit 1
          fi
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$API_KEY" | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8"

      - name: Upload to App Store Connect
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          cd build-output
          xcrun altool --upload-app \
            --type ios \
            --file portrai-release.ipa \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_API_ISSUER_ID"

      - name: Report upload
        env:
          VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ inputs.build-number }}
        run: |
          echo "Uploaded version $VERSION ($BUILD_NUMBER) to App Store Connect."
          echo "Wait for Apple processing, then assign the build to TestFlight testers."
          echo "Public App Store review has not been submitted."

      - name: Clean up API key
        if: ${{ always() }}
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        run: |
          if [[ "$API_KEY_ID" =~ ^[A-Za-z0-9]+$ ]]; then
            rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8"
          fi
