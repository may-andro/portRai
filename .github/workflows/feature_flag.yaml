name: Feature Flag CI

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'layer/feature_flag/**'
      - '.github/workflows/feature_flag.yaml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'layer/feature_flag/**'
      - '.github/workflows/feature_flag.yaml'
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: 📚 Checkout repository
        uses: actions/checkout@v4

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: 📦 Install dependencies
        working-directory: layer/feature_flag
        run: flutter pub get

      - name: ✨ Verify formatting
        working-directory: layer/feature_flag
        run: dart format --output=none --set-exit-if-changed .

      - name: 🔍 Analyze project
        working-directory: layer/feature_flag
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: 🔒 Check for outdated dependencies
        working-directory: layer/feature_flag
        run: flutter pub outdated --show-all || true

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: 📚 Checkout repository
        uses: actions/checkout@v4

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: 📦 Install dependencies
        working-directory: layer/feature_flag
        run: flutter pub get

      - name: 🧪 Run tests
        working-directory: layer/feature_flag
        run: flutter test --coverage --reporter expanded

      - name: 📊 Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: layer/feature_flag/coverage/lcov.info
          flags: feature_flag
          name: feature-flag-coverage
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: 📈 Coverage report
        working-directory: layer/feature_flag
        run: |
          if [ -f "coverage/lcov.info" ]; then
            echo "### Coverage Report 📊" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Coverage data generated successfully" >> $GITHUB_STEP_SUMMARY
            echo "Check Codecov for detailed coverage metrics" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ No coverage data generated" >> $GITHUB_STEP_SUMMARY
          fi

  build:
    name: Build Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: 📚 Checkout repository
        uses: actions/checkout@v4

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: 📦 Install dependencies
        working-directory: layer/feature_flag
        run: flutter pub get

      - name: 🏗️ Build library
        working-directory: layer/feature_flag
        run: flutter build bundle

      - name: ✅ Build successful
        run: echo "Build completed successfully ✅"

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [analyze, test, build]
    if: always()
    
    steps:
      - name: 🚦 Check quality gate
        run: |
          if [ "${{ needs.analyze.result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.build.result }}" != "success" ]; then
            echo "❌ Quality gate failed"
            echo "Analyze: ${{ needs.analyze.result }}"
            echo "Test: ${{ needs.test.result }}"
            echo "Build: ${{ needs.build.result }}"
            exit 1
          fi
          echo "✅ All quality checks passed"
          
      - name: 📝 Summary
        run: |
          echo "### Quality Gate Results ✨" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Analyze | ${{ needs.analyze.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Test | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
