name: Coverage Report

on:
  workflow_run:
    workflows:
      - cache
      - core
      - design_system
      - error_reporter
      - feature_flag
      - firebase
      - log_reporter
      - module_injector
      - portrai
      - remote
      - tracking
      - use_case
      - firestore_export_import
    types:
      - completed
    branches:
      - '**'

permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  collect-coverage:
    name: Collect & Report Coverage
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download coverage artifacts from workflow run
        id: download-coverage
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            // Get artifacts from the triggering workflow run
            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.payload.workflow_run.id,
            });
            
            // Filter for coverage artifacts
            const coverageArtifacts = artifacts.data.artifacts.filter(artifact => 
              artifact.name.startsWith('coverage-')
            );
            
            if (coverageArtifacts.length === 0) {
              console.log('No coverage artifacts found in this workflow run');
              core.setOutput('has_coverage', 'false');
              return;
            }
            
            // Create directory
            fs.mkdirSync('./all-coverage', { recursive: true });
            
            // Download each coverage artifact
            for (const artifact of coverageArtifacts) {
              console.log(`Downloading artifact: ${artifact.name}`);
              
              const download = await github.rest.actions.downloadArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id,
                archive_format: 'zip',
              });
              
              const artifactPath = `./all-coverage/${artifact.name}.zip`;
              fs.writeFileSync(artifactPath, Buffer.from(download.data));
              
              // Unzip the artifact
              const { execSync } = require('child_process');
              execSync(`unzip -o "${artifactPath}" -d "./all-coverage/${artifact.name}"`);
              fs.unlinkSync(artifactPath);
            }
            
            core.setOutput('has_coverage', 'true');

      - name: Merge coverage reports
        id: merge
        if: steps.download-coverage.outputs.has_coverage == 'true'
        run: |
          # Install lcov for merging coverage reports
          sudo apt-get update
          sudo apt-get install -y lcov
          
          # Find all lcov.info files
          find ./all-coverage -name "lcov.info" -type f > coverage-files.txt
          
          if [ -s coverage-files.txt ]; then
            echo "Found coverage files:"
            cat coverage-files.txt
            
            # Merge all coverage files
            lcov $(cat coverage-files.txt | sed 's/^/--add-tracefile /' | tr '\n' ' ') \
              --output-file merged-coverage.info
            
            # Generate summary
            lcov --summary merged-coverage.info > coverage-summary.txt 2>&1
            cat coverage-summary.txt
            echo "has_summary=true" >> $GITHUB_OUTPUT
          else
            echo "No coverage files found"
            echo "has_summary=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload merged coverage to Codecov
        if: steps.merge.outputs.has_summary == 'true'
        uses: codecov/codecov-action@v4
        with:
          files: ./merged-coverage.info
          flags: merged
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Comment coverage on PR
        uses: actions/github-script@v7
        if: steps.merge.outputs.has_summary == 'true' && github.event.workflow_run.event == 'pull_request'
        with:
          script: |
            const fs = require('fs');
            
            // Read coverage summary
            const summary = fs.readFileSync('coverage-summary.txt', 'utf8');
            
            // Extract coverage percentage
            const match = summary.match(/lines\.*:\s*(\d+\.\d+)%/);
            const coverage = match ? match[1] : 'unknown';
            
            // Get PR number from workflow_run
            const prNumber = context.payload.workflow_run.pull_requests[0]?.number;
            if (!prNumber) {
              console.log('No PR number found');
              return;
            }
            
            // Create comment body
            const body = `## 📊 Test Coverage Report
            
            **Overall Coverage:** ${coverage}%
            
            <details>
            <summary>Coverage Details</summary>
            
            \`\`\`
            ${summary}
            \`\`\`
            
            </details>
            
            View detailed report on [Codecov](https://codecov.io/gh/${context.repo.owner}/${context.repo.repo}/pull/${prNumber})
            `;
            
            // Find existing coverage comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            
            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('Test Coverage Report')
            );
            
            // Update or create comment
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: body
              });
            }
