name: Portrai Preview Release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    tags:
      - '*+*-review'

permissions: write-all

jobs:
  # Extract version and build number from tag
  extract-version:
    name: Extract Version Info
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract.outputs.version }}
      build-number: ${{ steps.extract.outputs.build-number }}
      release-notes: ${{ steps.generate-notes.outputs.notes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Extract version and build
        id: extract
        uses: ./.github/actions/extract-version-build
      
      - name: Generate release notes
        id: generate-notes
        run: |
          # Find previous review tag
          prev_tag="$(git tag --sort=-committerdate -l '*+*-review' | grep -v $GITHUB_REF_NAME | head -n 1)"
          
          # Generate release notes
          {
            echo "notes<<EOF"
            echo "Version ${{ steps.extract.outputs.version }} (Build ${{ steps.extract.outputs.build-number }})"
            echo ""
            echo "Preview Build - For Testing Only"
            echo ""
            if [ -n "$prev_tag" ]; then
              echo "Changes since $prev_tag:"
              git log --pretty="format:• %s" $prev_tag..$GITHUB_REF_NAME
            else
              echo "Initial release"
              git log --pretty="format:• %s" $GITHUB_REF_NAME --max-count=10
            fi
            echo ""
            echo ""
            echo "Triggered by: ${{ github.actor }}"
            echo "Commit: ${GITHUB_SHA:0:8}"
            echo "EOF"
          } >> $GITHUB_OUTPUT

  # Quality checks must pass before building
  quality:
    name: Quality Checks
    needs: [extract-version]
    uses: ./.github/workflows/portrai.yaml

  # Build all platforms in parallel after quality checks pass
  build-android:
    name: Build Android
    needs: [extract-version, quality]
    uses: ./.github/workflows/_build_android.yaml
    with:
      app-path: ./app/portrai
      build-type: preview
      version: ${{ needs.extract-version.outputs.version }}
      build-number: ${{ needs.extract-version.outputs.build-number }}
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.PORTRAI_ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.PORTRAI_ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.PORTRAI_ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.PORTRAI_ANDROID_KEY_PASSWORD }}
      GOOGLE_SERVICES_JSON: ${{ secrets.PORTRAI_GOOGLE_SERVICES_JSON }}

  build-ios:
    name: Build iOS
    needs: [extract-version, quality]
    uses: ./.github/workflows/_build_ios.yaml
    with:
      app-path: ./app/portrai
      build-type: preview
      version: ${{ needs.extract-version.outputs.version }}
      build-number: ${{ needs.extract-version.outputs.build-number }}
    secrets:
      GOOGLE_SERVICES_PLIST: ${{ secrets.PORTRAI_GOOGLE_SERVICES_PLIST }}

  build-web:
    name: Build Web
    needs: [extract-version, quality]
    uses: ./.github/workflows/_build_web.yaml
    with:
      app-path: ./app/portrai
      app-name: portrai
      build-type: preview
      use-firebase: true
      version: ${{ needs.extract-version.outputs.version }}
      build-number: ${{ needs.extract-version.outputs.build-number }}
    secrets:
      FIREBASE_OPTIONS: ${{ secrets.PORTRAI_FIREBASE_OPTIONS }}

  # Deploy after builds complete
  deploy-android:
    name: Deploy Android
    needs: [build-android, extract-version]
    uses: ./.github/workflows/_deploy_firebase.yaml
    with:
      app-path: app/portrai
      platform: android
      build-type: preview
      artifact-name: ${{ needs.build-android.outputs.artifact-name }}
      release-notes: ${{ needs.extract-version.outputs.release-notes }}
    secrets:
      FIREBASE_APP_ID_ANDROID: ${{ secrets.PORTRAI_FIREBASE_APP_ID_ANDROID }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.PORTRAI_FIREBASE_SERVICE_ACCOUNT }}
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}

  deploy-ios:
    name: Deploy iOS
    needs: [build-ios, extract-version]
    uses: ./.github/workflows/_deploy_firebase.yaml
    with:
      app-path: app/portrai
      platform: ios
      build-type: preview
      artifact-name: ${{ needs.build-ios.outputs.artifact-name }}
      release-notes: ${{ needs.extract-version.outputs.release-notes }}
    secrets:
      FIREBASE_APP_ID_IOS: ${{ secrets.PORTRAI_FIREBASE_APP_ID_IOS }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.PORTRAI_FIREBASE_SERVICE_ACCOUNT }}
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}

  deploy-web:
    name: Deploy Web
    needs: [build-web]
    uses: ./.github/workflows/_deploy_firebase.yaml
    with:
      app-path: app/portrai
      platform: web
      build-type: preview
      artifact-name: ${{ needs.build-web.outputs.artifact-name }}
    secrets:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_WEB_HOSTING_SERVICE_ACCOUNT }}
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
