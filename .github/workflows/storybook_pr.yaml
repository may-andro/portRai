name: Storybook PR Preview

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches:
      - '**'
    paths:
      - 'app/storybook/**'
      - 'layer/design_system/**'
      - '.github/workflows/storybook_*.yaml'
      - '.github/workflows/_storybook_*.yaml'
      - '.github/actions/setup-flutter-module/**'

permissions: write-all

jobs:
  # Format check, static analysis and unit tests run as parallel jobs
  # inside a single reusable workflow call.
  quality:
    name: Quality Checks
    uses: ./.github/workflows/_storybook_quality.yaml

  # Build starts once all quality checks pass.
  build:
    name: Build
    needs: [quality]
    uses: ./.github/workflows/_build_web.yaml
    with:
      app-path: ./app/storybook
      app-name: storybook
      build-type: preview
      force-release: true
      run-codegen: true

  # Deploy preview after build is complete.
  deploy:
    name: Deploy Preview
    needs: [build]
    uses: ./.github/workflows/_deploy_firebase.yaml
    with:
      app-path: app/storybook
      platform: web
      build-type: preview
      artifact-name: ${{ needs.build.outputs.artifact-name }}
      hosting-target: storybook
      channel-id: 'preview'
    secrets:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_WEB_HOSTING_SERVICE_ACCOUNT }}
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
