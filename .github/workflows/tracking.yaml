name: tracking

on:
  pull_request:
    paths:
      - 'layer/tracking/**'
      - '.github/workflows/tracking.yaml'
      - '.github/actions/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  analyze_and_test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Flutter Module
        uses: ./.github/actions/setup-flutter-module
        with:
          module-path: layer/tracking

      - name: Generate workspace code
        uses: ./.github/actions/generate-workspace-code
        with:
          package-name: tracking
      
      - name: Quality Checks
        uses: ./.github/actions/flutter-quality-checks
        with:
          module-path: layer/tracking
          collect-coverage: 'true'
