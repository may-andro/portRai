name: Build Android

on:
  workflow_call:
    inputs:
      app-path:
        description: Path to the Flutter app (e.g., ./app/portrai)
        required: true
        type: string
      build-type:
        description: Build type (preview or production)
        required: true
        type: string
      version:
        description: Version number (e.g., 1.1.4)
        required: true
        type: string
      build-number:
        description: Build number (e.g., 202530)
        required: true
        type: string
    outputs:
      artifact-name:
        description: Name of the build artifact
        value: ${{ jobs.build.outputs.artifact-name }}
    secrets:
      ANDROID_KEYSTORE_BASE64:
        description: Base64 encoded Android keystore file
        required: true
      ANDROID_KEYSTORE_PASSWORD:
        description: Android keystore password
        required: true
      ANDROID_KEY_ALIAS:
        description: Android key alias
        required: true
      ANDROID_KEY_PASSWORD:
        description: Android key password
        required: true
      GOOGLE_SERVICES_JSON:
        description: Base64 encoded google-services.json for Firebase
        required: true

env:
  FLUTTER_VERSION: 3.47.1

jobs:
  build:
    name: Build Android APK/AAB
    runs-on: ubuntu-latest
    outputs:
      artifact-name: portrai-android-${{ inputs.build-type }}-${{ github.sha }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup environment
        uses: ./.github/actions/setup-flutter-module
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          module-path: ${{ inputs.app-path }}

      - name: Inject google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > ${{ inputs.app-path }}/android/app/google-services.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          # Create .signing folder structure (same as local development)
          mkdir -p ${{ inputs.app-path }}/android/.signing
          
          # Decode and save keystore
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > ${{ inputs.app-path }}/android/.signing/portrai-release-key.jks
          
          # Create key.properties file
          cat > ${{ inputs.app-path }}/android/.signing/key.properties << EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          EOF
          
          echo "✅ Android signing configured for ${{ inputs.build-type }} build"

      - name: Build APK (Preview)
        if: ${{ inputs.build-type == 'preview' }}
        working-directory: ${{ inputs.app-path }}
        run: flutter build apk --release --build-name=${{ inputs.version }} --build-number=${{ inputs.build-number }}

      - name: Build AAB (Production)
        if: ${{ inputs.build-type == 'production' }}
        working-directory: ${{ inputs.app-path }}
        run: flutter build appbundle --release --build-name=${{ inputs.version }} --build-number=${{ inputs.build-number }}

      - name: Upload APK artifact (Preview)
        if: ${{ inputs.build-type == 'preview' }}
        uses: actions/upload-artifact@v4
        with:
          name: portrai-android-${{ inputs.build-type }}-${{ github.sha }}
          path: ${{ inputs.app-path }}/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

      - name: Upload AAB artifact (Production)
        if: ${{ inputs.build-type == 'production' }}
        uses: actions/upload-artifact@v4
        with:
          name: portrai-android-${{ inputs.build-type }}-${{ github.sha }}
          path: |
            ${{ inputs.app-path }}/build/app/outputs/bundle/release/app-release.aab
            ${{ inputs.app-path }}/build/app/outputs/mapping/release/mapping.txt
          retention-days: 30

      - name: Clean up signing folder
        if: ${{ always() }}
        run: |
          rm -rf ${{ inputs.app-path }}/android/.signing
