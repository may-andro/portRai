name: functions

on:
  pull_request:
    paths:
      - 'tool/functions/**'
      - '.github/workflows/functions.yaml'

permissions:
  contents: read

jobs:
  check:
    name: Format, Type Check & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tool/functions

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tool/functions/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check
        run: npm run check
