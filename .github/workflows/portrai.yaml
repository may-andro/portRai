name: portrai

on:
  pull_request:
    paths:
      - 'app/portrai/**'
      - '.github/workflows/portrai.yaml'
      - '.github/actions/**'
  workflow_call:  # Allow this workflow to be called by other workflows
    secrets:
      PORTRAI_FIREBASE_OPTIONS:
        description: Firebase options Dart file content
        required: true

permissions:
  contents: read
  pull-requests: write

jobs:
  analyze_and_test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Create firebase_options.dart
        env:
          FIREBASE_OPTIONS: ${{ secrets.PORTRAI_FIREBASE_OPTIONS }}
        run: |
          if [ -z "$FIREBASE_OPTIONS" ]; then
            echo "::error::PORTRAI_FIREBASE_OPTIONS is required to generate firebase_options.dart"
            exit 1
          fi
          printf '%s\n' "$FIREBASE_OPTIONS" > app/portrai/lib/firebase_options.dart
      
      - name: Setup Flutter Module
        uses: ./.github/actions/setup-flutter-module
        with:
          module-path: app/portrai

      - name: Generate workspace code
        uses: ./.github/actions/generate-workspace-code
        with:
          package-name: portrai
      
      - name: Quality Checks
        uses: ./.github/actions/flutter-quality-checks
        with:
          module-path: app/portrai
          collect-coverage: 'true'
