name: Build Web

on:
  workflow_call:
    inputs:
      app-path:
        description: Path to the Flutter app (e.g., ./app/portrai)
        required: true
        type: string
      app-name:
        description: Short app name used for artifact naming (e.g., portrai, storybook)
        required: true
        type: string
      build-type:
        description: Build type (preview or production)
        required: true
        type: string
      version:
        description: Version number (e.g., 1.1.4) — leave empty to use the pubspec version
        required: false
        type: string
        default: ''
      build-number:
        description: Build number (e.g., 202530) — leave empty to use the pubspec build number
        required: false
        type: string
        default: ''
      force-release:
        description: Always build with --release regardless of build-type (e.g., for storybook)
        required: false
        type: boolean
        default: false
      use-firebase:
        description: Whether this app uses Firebase (creates firebase_options.dart from secret)
        required: false
        type: boolean
        default: false
      app-check-site-key:
        description: Public reCAPTCHA Enterprise site key required for Firebase App Check
        required: false
        type: string
        default: ''
      run-codegen:
        description: Whether to run build_runner code generation before build
        required: false
        type: boolean
        default: false
      setup-sqlite:
        description: Whether to generate SQLite web worker and WASM assets before build
        required: false
        type: boolean
        default: false
    outputs:
      artifact-name:
        description: Name of the build artifact
        value: ${{ jobs.build.outputs.artifact-name }}

    secrets:
      FIREBASE_OPTIONS:
        description: Firebase options file content
        required: false

env:
  FLUTTER_VERSION: 3.47.4

jobs:
  build:
    name: Build Web
    runs-on: ubuntu-latest
    env:
      FIREBASE_APP_CHECK_WEB_SITE_KEY: ${{ inputs.app-check-site-key }}
      BUILD_ENV: ${{ inputs.build-type == 'production' && 'prod' || 'staging' }}
    outputs:
      artifact-name: ${{ inputs.app-name }}-web-${{ inputs.build-type }}-${{ github.sha }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Firebase App Check site key
        if: inputs.use-firebase
        run: |
          if [ -z "$FIREBASE_APP_CHECK_WEB_SITE_KEY" ]; then
            echo "::error::Firebase web builds require app-check-site-key. Set the FIREBASE_APP_CHECK_WEB_SITE_KEY repository variable to your public reCAPTCHA Enterprise site key."
            exit 1
          fi
      
      - name: Create firebase_options.dart
        if: inputs.use-firebase
        run: |
          echo "${{ secrets.FIREBASE_OPTIONS }}" > ${{ inputs.app-path }}/lib/firebase_options.dart

      - name: Setup environment
        uses: ./.github/actions/setup-flutter-module
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          module-path: ${{ inputs.app-path }}

      - name: Generate workspace code
        if: inputs.run-codegen
        uses: ./.github/actions/generate-workspace-code
        with:
          package-name: ${{ inputs.app-name }}

      - name: Generate SQLite web assets
        if: inputs.setup-sqlite
        working-directory: ${{ inputs.app-path }}
        run: |
          dart run sqflite_common_ffi_web:setup --force
          test -s web/sqflite_sw.js
          test -s web/sqlite3.wasm

      - name: Build web (Preview — profile)
        if: ${{ inputs.build-type == 'preview' && !inputs.force-release }}
        working-directory: ${{ inputs.app-path }}
        run: |
          flutter build web --profile \
            --dart-define=ENVIRONMENT=preview \
            --dart-define="build_env=$BUILD_ENV" \
            --dart-define="FIREBASE_APP_CHECK_WEB_SITE_KEY=$FIREBASE_APP_CHECK_WEB_SITE_KEY" \
            ${{ inputs.version != '' && format('--build-name={0}', inputs.version) || '' }} \
            ${{ inputs.build-number != '' && format('--build-number={0}', inputs.build-number) || '' }}

      - name: Build web (Production or force-release)
        if: ${{ inputs.build-type == 'production' || inputs.force-release }}
        working-directory: ${{ inputs.app-path }}
        run: |
          flutter build web --release \
            --dart-define=ENVIRONMENT=${{ inputs.build-type }} \
            --dart-define="build_env=$BUILD_ENV" \
            --dart-define="FIREBASE_APP_CHECK_WEB_SITE_KEY=$FIREBASE_APP_CHECK_WEB_SITE_KEY" \
            ${{ inputs.version != '' && format('--build-name={0}', inputs.version) || '' }} \
            ${{ inputs.build-number != '' && format('--build-number={0}', inputs.build-number) || '' }}

      - name: Verify SQLite assets in build output
        if: inputs.setup-sqlite
        working-directory: ${{ inputs.app-path }}
        run: |
          test -s build/web/sqflite_sw.js
          test -s build/web/sqlite3.wasm

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.app-name }}-web-${{ inputs.build-type }}-${{ github.sha }}
          path: ${{ inputs.app-path }}/build/web/
          retention-days: ${{ inputs.build-type == 'production' && 30 || 7 }}
