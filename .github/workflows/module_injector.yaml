name: module_injector

on:
  pull_request:
    paths:
      - 'layer/module_injector/**'
      - '.github/workflows/module_injector.yaml'
      - '.github/actions/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  analyze_and_test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Flutter Module
        uses: ./.github/actions/setup-flutter-module
        with:
          module-path: layer/module_injector
      
      - name: Quality Checks
        uses: ./.github/actions/flutter-quality-checks
        with:
          module-path: layer/module_injector
          collect-coverage: 'true'
