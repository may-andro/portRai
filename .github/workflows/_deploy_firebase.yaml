name: Deploy to Firebase

on:
  workflow_call:
    inputs:
      app-path:
        description: Path to the Flutter app (e.g., app/portrai)
        required: true
        type: string
      platform:
        description: Platform to deploy (android, ios, or web)
        required: true
        type: string
      build-type:
        description: Build type (preview or production)
        required: true
        type: string
      artifact-name:
        description: Name of the build artifact to deploy
        required: true
        type: string
      release-notes:
        description: Release notes to include in deployment
        required: false
        type: string
        default: ''
      hosting-target:
        description: Firebase Hosting target name (e.g., portrai, storybook)
        required: false
        type: string
        default: 'portrai'
      channel-id:
        description: Firebase Hosting channel override (e.g., live, preview, review). If empty, derived from build-type.
        required: false
        type: string
        default: ''
    secrets:
      FIREBASE_APP_ID_ANDROID:
        required: false
      FIREBASE_APP_ID_IOS:
        required: false
      FIREBASE_SERVICE_ACCOUNT:
        required: false
      FIREBASE_PROJECT_ID:
        required: false

jobs:
  deploy-mobile:
    name: Deploy to Firebase App Distribution
    if: ${{ inputs.platform == 'android' || inputs.platform == 'ios' }}
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: ./build-output

      - name: Compute release notes
        id: notes
        env:
          RELEASE_NOTES: ${{ inputs.release-notes }}
          BUILD_TYPE: ${{ inputs.build-type }}
        run: |
          if [ -z "$RELEASE_NOTES" ]; then
            RELEASE_NOTES="Build $GITHUB_SHA - Type: $BUILD_TYPE - By: $GITHUB_ACTOR"
          fi
          delimiter="release_notes_$(openssl rand -hex 16)"
          while printf '%s\n' "$RELEASE_NOTES" | grep -Fxq "$delimiter"; do
            delimiter="release_notes_$(openssl rand -hex 16)"
          done
          {
            printf 'value<<%s\n' "$delimiter"
            printf '%s\n' "$RELEASE_NOTES"
            printf '%s\n' "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare Firebase credentials
        id: creds
        uses: ./.github/actions/prepare-service-account
        with:
          credentials-base64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          file-path: .deployment-credentials/service-account.json

      - name: Deploy Android to Firebase App Distribution
        if: ${{ inputs.platform == 'android' }}
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID_ANDROID }}
          serviceCredentialsFile: ${{ steps.creds.outputs.file }}
          groups: ${{ inputs.build-type == 'preview' && 'testers' || 'production-testers' }}
          file: ${{ inputs.build-type == 'production' && 'build-output/bundle/release/app-release.aab' || 'build-output/app-release.apk' }}
          releaseNotes: ${{ steps.notes.outputs.value }}

      - name: Deploy iOS to Firebase App Distribution
        if: ${{ inputs.platform == 'ios' }}
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID_IOS }}
          serviceCredentialsFile: ${{ steps.creds.outputs.file }}
          groups: ${{ inputs.build-type == 'preview' && 'testers' || 'production-testers' }}
          file: ${{ inputs.build-type == 'production' && 'build-output/portrai-release.ipa' || 'build-output/portrai-debug.ipa' }}
          releaseNotes: ${{ steps.notes.outputs.value }}

      - name: Remove Firebase credentials
        if: ${{ always() }}
        run: |
          rm -f .deployment-credentials/service-account.json
          if [ -d .deployment-credentials ]; then
            rmdir .deployment-credentials
          fi

  deploy-web:
    name: Deploy to Firebase Hosting
    if: ${{ inputs.platform == 'web' }}
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.app-path }}/build/web

      - name: Prepare Firebase credentials
        id: creds
        uses: ./.github/actions/prepare-service-account
        with:
          credentials-base64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          expose-json: 'true'

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ steps.creds.outputs.json }}
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
          entryPoint: ${{ inputs.app-path }}
          channelId: ${{ inputs.channel-id != '' && inputs.channel-id || (inputs.build-type == 'preview' && 'preview' || 'live') }}
          target: ${{ inputs.hosting-target }}

      - name: Remove Firebase credentials
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/deployment-service-account.json"
