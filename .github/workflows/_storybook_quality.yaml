name: Storybook Quality Checks

on:
  workflow_call:

env:
  FLUTTER_VERSION: 3.47.1
  STORYBOOK_PATH: ./app/storybook

jobs:
  format-check:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup environment
        uses: ./.github/actions/setup-flutter-module
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          module-path: ${{ env.STORYBOOK_PATH }}

      - name: Format check
        working-directory: ${{ env.STORYBOOK_PATH }}
        run: dart format . --set-exit-if-changed

  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup environment
        uses: ./.github/actions/setup-flutter-module
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          module-path: ${{ env.STORYBOOK_PATH }}
          run-codegen: 'true'

      - name: Analyze code
        working-directory: ${{ env.STORYBOOK_PATH }}
        run: flutter analyze

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup environment
        uses: ./.github/actions/setup-flutter-module
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          module-path: ${{ env.STORYBOOK_PATH }}
          run-codegen: 'true'

      - name: Run unit tests
        working-directory: ${{ env.STORYBOOK_PATH }}
        run: |
          # Run tests and capture only JSON output (skip dependency resolution logs)
          flutter test --exclude-tags golden --coverage --machine 2>&1 | tee test-results-raw.log | grep -E '^\{' > test-results.json || true
          # If no valid JSON found, create empty results
          if [ ! -s test-results.json ]; then
            echo '{"protocolVersion":"0.1.1","type":"allSuites","time":0}' > test-results.json
          fi

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: test-results
          path: ${{ env.STORYBOOK_PATH }}/test-results.json

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: coverage
          path: ${{ env.STORYBOOK_PATH }}/coverage/

      - name: Generate test report
        uses: dorny/test-reporter@v1.9.1
        if: ${{ always() }}
        continue-on-error: true
        with:
          name: Test Results
          path: test-results.json
          reporter: flutter-json
          working-directory: ${{ env.STORYBOOK_PATH }}
