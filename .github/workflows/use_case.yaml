name: use_case

on:
  pull_request:
    paths:
      - 'layer/use_case/**'
      - '.github/workflows/use_case.yaml'

jobs:
  analyze_and_test:
    name: Analyze & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        working-directory: layer/use_case
        run: dart format --set-exit-if-changed .

      - name: Static analysis
        working-directory: layer/use_case
        run: dart analyze --fatal-infos .

      - name: Run tests
        working-directory: layer/use_case
        run: flutter test

