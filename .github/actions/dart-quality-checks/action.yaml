name: Dart Quality Checks
description: Run formatting, analysis, and tests for a Dart module

inputs:
  module-path:
    description: Path to the Dart module to check
    required: true
  collect-coverage:
    description: Whether to collect test coverage
    required: false
    default: 'false'
  upload-coverage:
    description: Whether to upload coverage to Codecov
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Verify formatting
      shell: bash
      working-directory: ${{ inputs.module-path }}
      run: dart format --set-exit-if-changed .

    - name: Static analysis
      shell: bash
      working-directory: ${{ inputs.module-path }}
      run: dart analyze --fatal-infos .

    - name: Run tests
      shell: bash
      working-directory: ${{ inputs.module-path }}
      run: |
        if [ "${{ inputs.collect-coverage }}" = "true" ]; then
          dart test --coverage=coverage
        else
          dart test
        fi

    - name: Format coverage
      if: inputs.collect-coverage == 'true'
      shell: bash
      working-directory: ${{ inputs.module-path }}
      run: |
        dart pub global activate coverage
        dart pub global run coverage:format_coverage --lcov --in=coverage --out=coverage/lcov.info --report-on=lib

    - name: Upload coverage to artifact
      if: inputs.collect-coverage == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: coverage-${{ hashFiles(format('{0}/pubspec.yaml', inputs.module-path)) }}
        path: ${{ inputs.module-path }}/coverage/
        retention-days: 7

    - name: Upload to Codecov
      if: inputs.upload-coverage == 'true'
      uses: codecov/codecov-action@v4
      with:
        directory: ${{ inputs.module-path }}/coverage/
        flags: ${{ inputs.module-path }}
        fail_ci_if_error: false
