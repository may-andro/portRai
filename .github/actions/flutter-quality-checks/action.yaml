name: Flutter Quality Checks
description: Run formatting, analysis, and tests for a Flutter module

inputs:
  module-path:
    description: Path to the Flutter module to check
    required: true
  test-command:
    description: Test command to run
    required: false
    default: 'flutter test'
  collect-coverage:
    description: Whether to collect test coverage
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Verify formatting
      shell: bash
      working-directory: ${{ inputs.module-path }}
      run: dart format --set-exit-if-changed .

    - name: Static analysis
      shell: bash
      working-directory: ${{ inputs.module-path }}
      run: dart analyze --fatal-infos .

    - name: Run tests
      shell: bash
      working-directory: ${{ inputs.module-path }}
      run: |
        if [ "${{ inputs.collect-coverage }}" = "true" ]; then
          ${{ inputs.test-command }} --coverage
        else
          ${{ inputs.test-command }}
        fi

    - name: Generate coverage report
      if: inputs.collect-coverage == 'true'
      uses: zgosalvez/github-actions-report-lcov@v4.1.22
      with:
        coverage-files: ${{ inputs.module-path }}/coverage/lcov.info
        minimum-coverage: 0
        artifact-name: code-coverage-${{ hashFiles(format('{0}/pubspec.yaml', inputs.module-path)) }}
        github-token: ${{ github.token }}
        update-comment: true
