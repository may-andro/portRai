name: Setup Flutter Module
description: Setup Flutter SDK and install dependencies for a workspace module

inputs:
  flutter-version:
    description: Flutter SDK version to install
    required: false
    default: '3.47.1'
  module-path:
    description: Path to the Flutter module
    required: true

runs:
  using: composite
  steps:
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ inputs.flutter-version }}
        channel: stable
        cache: true

    - name: Get dependencies cache key
      id: pubspec-cache
      shell: bash
      run: echo "hash=${{ hashFiles('**/pubspec.lock') }}" >> $GITHUB_OUTPUT

    - name: Cache Flutter dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.pub-cache
          **/.dart_tool
        key: flutter-pub-${{ runner.os }}-${{ steps.pubspec-cache.outputs.hash }}
        restore-keys: |
          flutter-pub-${{ runner.os }}-

    - name: Get dependencies
      shell: bash
      run: flutter pub get

    - name: Create assets from templates
      shell: bash
      working-directory: ${{ inputs.module-path }}
      run: |
        # Copy .template.json files to actual .json files for CI
        if [ -d "assets/dashboard" ]; then
          for template in assets/dashboard/*.template.json; do
            if [ -f "$template" ]; then
              target="${template%.template.json}.json"
              cp "$template" "$target"
              echo "Created: $target"
            fi
          done
        fi
