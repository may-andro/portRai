name: storybook
description: "Web project for design system in PortRai"
publish_to: 'none'
resolution: workspace

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  design_system:
    path: ../../layer/design_system
  flutter_native_splash: ^2.4.6
  package_info_plus: ^9.0.0
  widgetbook: ^3.25.0
  widgetbook_annotation: ^3.7.0
dev_dependencies:
  build_runner: ^2.5.4
  flutter_gen_runner: ^5.12.0
  flutter_test:
    sdk: flutter
  widgetbook_generator: ^3.15.0

flutter:
  uses-material-design: true

flutter_gen:
  output: lib/assets/